name: APK Android

# Se ejecuta cada vez que hay cambios en main (y en las ramas de trabajo de Claude).
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LLAVE_PROPIA: ${{ secrets.GEMELOS_KEYSTORE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Probar los datos del juego y la dificultad
        run: node --test tests/*.test.js

      - name: Probar Gemelos del Sol 2 (datos, combate y dificultad)
        run: node --test gemelos2/tests/*.test.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # Opcional: si guardas tu propia llave de firma en Settings > Secrets
      # (GEMELOS_KEYSTORE en base64 y GEMELOS_KEYSTORE_PASSWORD), se usa esa.
      - name: Llave de firma propia (si existe)
        if: env.LLAVE_PROPIA != ''
        run: |
          echo "$LLAVE_PROPIA" | base64 -d > "$RUNNER_TEMP/gemelos.keystore"
          echo "GEMELOS_KEYSTORE_FILE=$RUNNER_TEMP/gemelos.keystore" >> "$GITHUB_ENV"

      - name: Copiar los juegos dentro de los APK
        run: |
          mkdir -p android/app/src/main/assets/www gemelos2/android/app/src/main/assets/www
          cp -r index.html manifest.json css js iconos android/app/src/main/assets/www/
          cp -r gemelos2/index.html gemelos2/manifest.json gemelos2/css gemelos2/js gemelos2/iconos gemelos2/android/app/src/main/assets/www/

      - name: Compilar APK (juego 1)
        env:
          GEMELOS_KEYSTORE_PASSWORD: ${{ secrets.GEMELOS_KEYSTORE_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Compilar APK (Gemelos del Sol 2)
        env:
          GEMELOS_KEYSTORE_PASSWORD: ${{ secrets.GEMELOS_KEYSTORE_PASSWORD }}
        run: gradle -p gemelos2/android assembleRelease --no-daemon

      - name: Renombrar APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "GemelosDelSol-1.0.${{ github.run_number }}.apk"
          cp gemelos2/android/app/build/outputs/apk/release/app-release.apk "GemelosDelSol2-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: GemelosDelSol-apk
          path: GemelosDelSol*.apk

      # Solo en main: crea una versión (Release) con el APK para descargarlo desde el teléfono.
      - name: Publicar versión
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" "GemelosDelSol-1.0.${{ github.run_number }}.apk" "GemelosDelSol2-1.0.${{ github.run_number }}.apk" \
            --title "Gemelos del Sol 1 y 2 · versión 1.0.${{ github.run_number }}" \
            --notes "Dos juegos: GemelosDelSol (La luz de Xibalbá) y GemelosDelSol2 (El Sello de Camazotz). Descarga el .apk desde el celular Android e instálalo. Son apps separadas: puedes tener las dos. Si ya tienes el juego, se actualiza sin perder tu partida." \
            --latest
